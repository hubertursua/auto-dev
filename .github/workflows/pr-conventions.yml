name: pr-conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  branch-and-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the branch name and PR title
        # Passed through env, never interpolated into the script, since both
        # are user-controlled text.
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/check-pr.py --branch "$BRANCH" --title "$TITLE"
